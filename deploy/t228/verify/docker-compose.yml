# Isolated live-wire verification stack for autonomy/t:228. Proves the
# Caddy-forwarding half of the additive-uuid-header criterion (auth-service
# emits X-Auth-Actor conditionally, Caddy's copy_headers forwards it, and a
# client-forged X-Auth-Actor is stripped) against real, pinned binaries —
# without touching anything under /opt/docker.
#
# Run with -p t228-verify explicitly on every invocation (also set as the
# default project name below) so `down -v` can never reach another
# project's resources. Own bridge network, never `proxy`. No host port
# publish at all: caddy is reached only from the `probe` sibling
# container over the `verify` network, never through the host's TCP
# stack. This isn't just belt-and-suspenders around the live Caddy's
# 0.0.0.0:80/443 collision risk -- an ephemeral loopback publish
# (`127.0.0.1::80`) was tried first and found genuinely unreliable on
# this machine: the Colima VM's host<->VM port-forwarder did not
# reliably surface newly-created or restarted containers' ephemeral
# ports on the macOS host side (confirmed via `lsof` on the host showing
# no listener while `colima ssh -- ss -tlnp` showed the port bound
# inside the VM), while container-to-container traffic on the custom
# bridge network was reliable throughout. verify.sh drives every probe
# via `docker compose exec probe curl ...`.
#
# NO bind-mount volumes here (deliberately): the Colima VM backing this
# Docker host only virtiofs-mounts /opt/docker and /Users/nir/notes
# (confirmed via `colima ssh -- mount`, 2026-09-02) -- $HOME is NOT
# mounted, so a host bind mount of anything under this worktree fails at
# container-create time with a "not a directory" OCI runtime error, even
# though the path exists and is the right type on the host. Editing
# Colima's mount config would require a VM restart that bounces every
# live container (caddy-caddy-1, obsidian-memory, voice-chat-prototype)
# -- out of scope for an isolated verification stack. verify.sh instead
# injects the Caddyfile and seed-config files via `docker cp` (a
# host<->daemon data copy over the Docker API, independent of any VM
# filesystem mount) before each container's first start.
name: t228-verify

services:
  auth-service:
    build:
      context: ../../../
      dockerfile: docker/Dockerfile.auth.local
    # Required at startup (main.rs bails without it); this stack never
    # exercises a real WebAuthn ceremony (see README's seeding rationale),
    # so the value only needs to parse as a URL, not resolve anywhere.
    environment:
      - AUTH_PUBLIC_URL=http://t228-verify.local
    networks:
      - verify

  echo:
    # Header-reflecting upstream (/headers returns request headers as
    # JSON). Pinned to the newest confirmed-present versioned tag on
    # Docker Hub as of 2026-09-02; digest recorded in README.md.
    image: mccutchen/go-httpbin:2.25.0@sha256:20739736d4eb8dc1b998dff701f437b8bd62dcc46492bd0d861e89890ca36500
    networks:
      - verify

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      - auth-service
      - echo
    networks:
      - verify

  # Sibling probe container -- the only way verify.sh reaches the stack,
  # per the "no live-network attachment / no host port" isolation
  # constraint. Never issues requests itself at container start (stays
  # alive via `sleep infinity`); verify.sh drives it with
  # `docker compose exec probe curl ...`.
  probe:
    image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    entrypoint: ["sleep", "infinity"]
    depends_on:
      - caddy
    networks:
      - verify

networks:
  verify:
    driver: bridge
