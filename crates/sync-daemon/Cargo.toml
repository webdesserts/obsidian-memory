[package]
name = "sync-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sync-daemon"
path = "src/main.rs"

[dependencies]
sync-core = { path = "../sync-core", features = ["native"] }
# Peer identity + file-backed key storage (FileKeyStorage, IdentityKey).
p2p-core = { path = "../p2p-core" }
# vault-sync has no Cargo features — its native/wasm fork is `cfg(target_arch)`,
# so this dep line is bare (a `features = [...]` spec would fail to resolve).
vault-sync = { path = "../vault-sync" }
memory-common = { path = "../memory-common" }
tokio.workspace = true
bincode.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# File watching
notify.workspace = true
notify-debouncer-mini.workspace = true

# CLI
clap.workspace = true

# Health endpoint HTTP server
axum.workspace = true

# File locking (flock-based daemon lock)
fs2 = "0.4"

# Hostname for device name detection
gethostname = "0.4"

# Document UUIDs — captured on the delete half of a move so the move-coalescer
# journal can re-stitch lineage on crash recovery (P4f-2).
uuid = { workspace = true, features = ["serde"] }

# Cancellation tokens for daemon shutdown (shared between prod and tests)
tokio-util = { version = "0.7", features = ["rt"] }

[package.metadata.dist]
dist = false

[dev-dependencies]
reqwest = "0.13.2"
tempfile.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Iroh is no longer a PRODUCTION dependency — the daemon reaches the network
# entirely through p2p-core. The integration tests still name iroh types directly
# (MemoryLookup harness plumbing, the `_for_test` raw handles, hand-rolled gossip
# scaffolding), so it stays a dev-dependency.
iroh = { version = "1.0.0-rc.1", default-features = false }
iroh-gossip = { version = "0.100", default-features = false, features = ["net"] }
bincode.workspace = true
anyhow.workspace = true
# `test-util` exposes SyncNode::new_relay_only for the off-LAN/NAT repro tests.
# Cargo unifies this with the production [dependencies] entry above, so it only
# affects test builds — plain `cargo build` keeps sync-core at `native` only.
sync-core = { path = "../sync-core", features = ["native", "test-util"] }
