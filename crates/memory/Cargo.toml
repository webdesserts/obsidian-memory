[package]
name = "memory"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/webdesserts/obsidian-memory"
homepage = "https://github.com/webdesserts/obsidian-memory"
description = "MCP server for Obsidian memory integration with Claude"

[[bin]]
name = "memory"
path = "src/main.rs"

[features]
default = ["sync"]
# Use model embedded in binary (for release builds)
embedded-model = ["semantic-embeddings/embedded-model"]
# Enable embedded sync daemon
sync = ["dep:sync-daemon"]

[dependencies]
# MCP SDK
rmcp = { version = "0.12", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }

# HTTP server
axum = { workspace = true }

# CLI argument parsing
clap.workspace = true

# Sync daemon (optional, for `memory sync up` and `memory up`)
sync-daemon = { path = "../sync-daemon", optional = true }

# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# JSON Schema for tool parameters
schemars = "1.0"

# URL encoding
urlencoding = "2.1"

# Platform directories (home dir, etc.)
dirs = "6"

# Workspace crates
memory-common = { path = "../memory-common" }
wiki-links = { path = "../wiki-links" }
obsidian-fs = { path = "../obsidian-fs" }
notes-core = { path = "../notes-core" }

# Tracing/logging
tracing.workspace = true
tracing-subscriber.workspace = true

# File watching
notify.workspace = true
notify-debouncer-mini.workspace = true

# HTTP client for runtime model downloads (not used with embedded-model feature)
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3" }

# Hashing for cache keys
sha2 = "0.10"
hex = "0.4"

# Semantic embeddings
semantic-embeddings = { path = "../semantic-embeddings" }

# Regex for parsing wiki-links
regex = "1"

# Lazy static initialization
once_cell = "1.21"

# Async traits
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
