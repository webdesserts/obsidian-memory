[package]
name = "sync-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
# Native-only: the async test runtime + proc macros. sync-core no longer names
# iroh directly — the socket-binding capability (direct QUIC, portmapper) now
# arrives transitively through `p2p-core`, an unconditional dependency that
# enables iroh's `default` feature. So `native` only gates tokio's rt + macros.
native = ["tokio/rt", "tokio/macros"]
# Test-only surface: exposes constructors that simulate constrained network
# conditions (e.g. relay-only endpoints with no IP transports) so downstream
# integration-test crates can reproduce off-LAN/NAT topologies. Never enabled
# in production builds. `#[cfg(test)]` would not cross the crate boundary into
# sync-daemon's integration tests, so this is a feature instead. The relay-only
# constructors now live on `p2p-core`'s `P2pNode`, so this forwards to
# `p2p-core/test-util` — the daemon's existing `sync-core/test-util` dev-dep line
# keeps the passthrough working unchanged.
test-util = ["p2p-core/test-util"]

[dependencies]
p2p-core = { path = "../p2p-core" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
bincode.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
uuid.workspace = true
rand.workspace = true
getrandom.workspace = true
ed25519-dalek.workspace = true

# Cross-platform async task spawning — drives the gossip decode pump.
# On native: delegates to tokio::spawn.
n0-future = "0.3"

# Utilities used by the network module — always needed (not native-only).
anyhow.workspace = true
bytes = "1"

# tokio::sync (channels, mutex) compiles to WASM and is used by the network module.
# The `native` feature above adds rt + macros for the async test runtime and proc macros.
# We specify the dep directly (not workspace) to avoid inheriting features = ["full"]
# which includes net/io features that don't compile to WASM.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tempfile.workspace = true
anyhow.workspace = true
bytes = "1"
# iroh is not a dependency of sync-core in any section. The `network_integration`
# test seeds a `MemoryLookup` and names `EndpointAddr` via `p2p-core`'s `test-util`
# re-exports — iroh arrives only transitively through p2p-core (an unconditional
# dependency that already enables iroh's `tls-ring` + `default` features).

# The two-node gossip/sync harness calls `P2pNode::endpoint_for_test()`, which is
# gated behind `test-util`. Declaring the requirement here makes cargo SKIP the
# test when the feature is off (instead of trying to compile it and failing on the
# missing method), so `cargo test -p sync-core` and `--test network_integration`
# both just work without remembering `--features test-util`.
[[test]]
name = "network_integration"
required-features = ["test-util"]

