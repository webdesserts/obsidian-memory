[package]
name = "sync-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
# Native-only: direct QUIC sockets (require OS networking) and full tokio runtime.
# iroh/default enables direct socket binding and portmapper — not available in WASM.
# The network module itself (gossip, streams, node) compiles for both native and WASM.
native = ["iroh/default", "dep:mdns-sd", "tokio/rt", "tokio/macros"]
# Test-only surface: exposes constructors that simulate constrained network
# conditions (e.g. relay-only endpoints with no IP transports) so downstream
# integration-test crates can reproduce off-LAN/NAT topologies. Never enabled
# in production builds. `#[cfg(test)]` would not cross the crate boundary into
# sync-daemon's integration tests, so this is a feature instead.
test-util = []

[dependencies]
loro.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
bincode.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
uuid.workspace = true
rand.workspace = true
getrandom.workspace = true
ed25519-dalek.workspace = true
sha2 = "0.10"
hmac = "0.12"

# P2P networking — iroh QUIC transport.
# default-features = false: skips portmapper and fast-apple-datapath (OS-specific).
# The `native` feature re-enables iroh/default for direct socket binding.
iroh = { version = "1.0.0-rc.1", default-features = false, features = ["tls-ring"] }

# iroh-gossip — HyParView membership + PlumTree broadcast.
# The `net` feature enables the Gossip API (GossipTopic, GossipSender, Event).
# tokio::sync (used by gossip internals) compiles to WASM, so net works in both targets.
iroh-gossip = { version = "0.100", default-features = false, features = ["net"] }
mdns-sd = { version = "0.20", optional = true }
data-encoding = "2"
tokio-stream = "0.1"

# Cross-platform async task spawning.
# On native: delegates to tokio::spawn. In WASM: uses wasm_bindgen_futures::spawn_local.
n0-future = "0.3"

# Utilities used by the network module — always needed (not native-only).
anyhow.workspace = true
bytes = "1"

# tokio::sync (channels, mutex) compiles to WASM and is used by the network module.
# The `native` feature above adds rt + macros for the async test runtime and proc macros.
# We specify the dep directly (not workspace) to avoid inheriting features = ["full"]
# which includes net/io features that don't compile to WASM.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tempfile.workspace = true
anyhow.workspace = true
bytes = "1"

