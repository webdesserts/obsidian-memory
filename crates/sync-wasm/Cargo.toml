[package]
name = "sync-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false excludes the `native` feature (iroh's QUIC stack + tokio)
# which is not available in WASM. Only the WASM-compatible subset of sync-core is used.
sync-core = { path = "../sync-core", default-features = false }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }
web-time.workspace = true
async-trait.workspace = true
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
# getrandom 0.3 is pulled in transitively by ahash -> quick_cache -> loro-kv-store.
# The wasm_js feature is required for WASM compilation.
getrandom_0_3.workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3"
