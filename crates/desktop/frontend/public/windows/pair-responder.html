<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pair request</title>
    <style>
      body {
        font: 13px -apple-system, system-ui, sans-serif;
        padding: 20px;
        text-align: center;
        color: #1d1d1f;
      }
      .device { font-weight: 600; }
      .code {
        font: 600 32px ui-monospace, monospace;
        letter-spacing: 6px;
        margin: 18px 0 6px;
      }
      .expires { color: #666; }
      .status { min-height: 1.4em; margin-top: 14px; }
      .status.ok { color: #2a2; }
      .status.error { color: #c33; }
      button { font: inherit; padding: 6px 14px; margin: 18px 4px 0; }
    </style>
  </head>
  <body>
    <p>Pair request from <span class="device" id="device">…</span></p>
    <p>Enter this code on the other device:</p>
    <div class="code" id="code">——————</div>
    <p class="expires">Expires in <span id="countdown">5:00</span></p>
    <div id="status" class="status"></div>
    <button id="reject">Reject</button>

    <script>
      // Vanilla DOM + Tauri JS API — served verbatim by Vite's public/ convention.
      // The window's identity, code, and expiry are delivered after the page loads
      // via the `pair://responder-init` event so the Rust side can listen-first /
      // emit-after-build without racing the page's listener registration.
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const currentWindow = window.__TAURI__.window.getCurrentWindow();

      const deviceEl = document.getElementById('device');
      const codeEl = document.getElementById('code');
      const countdownEl = document.getElementById('countdown');
      const statusEl = document.getElementById('status');
      const rejectBtn = document.getElementById('reject');

      // Init data is delivered via the URL's query string (set when the Rust
      // side calls `WebviewWindowBuilder`). This avoids a listen-vs-emit race
      // with the page load: the values are present in `window.location` the
      // moment the HTML parses, before any async work runs.
      const params = new URLSearchParams(window.location.search);
      deviceEl.textContent = params.get('device') ?? 'Unknown device';
      codeEl.textContent = params.get('code') ?? '——————';
      const expiresAt = parseInt(params.get('expires') ?? '0', 10) || null;

      function formatRemaining(ms) {
        const minutes = Math.floor(ms / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        return `${minutes}:${String(seconds).padStart(2, '0')}`;
      }

      function tick() {
        if (expiresAt === null) return;
        const remainingMs = expiresAt - Date.now();
        if (remainingMs <= 0) {
          countdownEl.textContent = '0:00';
          currentWindow.close();
          return;
        }
        countdownEl.textContent = formatRemaining(remainingMs);
        setTimeout(tick, 250);
      }

      tick();

      (async () => {
        // Auto-close paths: when the daemon confirms the pairing exchange
        // completed (success or failure), the listener closes the window.
        // Brief status messages give the user a visual confirmation before
        // the window disappears.
        await listen('pair://responder-completed', () => {
          statusEl.className = 'status ok';
          statusEl.textContent = 'Pairing complete.';
          rejectBtn.disabled = true;
          setTimeout(() => currentWindow.close(), 800);
        });

        await listen('pair://responder-failed', (event) => {
          statusEl.className = 'status error';
          statusEl.textContent = event.payload?.reason
            ? `Pairing failed: ${event.payload.reason}`
            : 'Pairing failed.';
          rejectBtn.disabled = true;
          setTimeout(() => currentWindow.close(), 1500);
        });
      })();

      rejectBtn.addEventListener('click', async () => {
        rejectBtn.disabled = true;
        try {
          await invoke('reject_inbound_pair');
        } catch (_) {
          // Reject is idempotent; ignore failure and close anyway.
        }
        currentWindow.close();
      });
    </script>
  </body>
</html>
