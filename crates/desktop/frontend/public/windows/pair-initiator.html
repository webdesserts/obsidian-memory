<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pair with nearby device</title>
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; padding: 16px; color: #1d1d1f; }
      h2 { margin: 0 0 12px; font-size: 16px; }
      select, input, button { font: inherit; }
      .row { margin: 10px 0; }
      .row label { display: inline-flex; align-items: center; gap: 8px; }
      #code { width: 8em; letter-spacing: 4px; font-family: ui-monospace, monospace; text-align: center; }
      #status { min-height: 1.4em; }
      #stage2 { display: none; }
      .error { color: #c33; }
      .ok { color: #2a2; }
      button { padding: 4px 12px; }
      button:disabled { opacity: 0.5; }
    </style>
  </head>
  <body>
    <h2>Pair with nearby device</h2>
    <div class="row" id="scan-status">Scanning for meshes on this network…</div>

    <!-- Stage 1: mesh selection + request -->
    <div id="stage1">
      <div class="row">
        <label>Mesh:
          <select id="mesh"><option disabled selected value="">—</option></select>
        </label>
      </div>
      <div class="row">
        <button id="request" disabled>Request pairing</button>
        <button id="cancel">Cancel</button>
      </div>
    </div>

    <!-- Stage 2: code entry + pair (hidden until RequestPairing succeeds) -->
    <div id="stage2">
      <div class="row" id="code-prompt">Enter the code shown on the other device:</div>
      <div class="row">
        <label>Code:
          <input id="code" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
        </label>
      </div>
      <div class="row">
        <button id="pair" disabled>Pair</button>
        <button id="cancel2">Cancel</button>
      </div>
    </div>

    <div id="status" class="row"></div>

    <script>
      // The pair-initiator window uses vanilla DOM + Tauri's JS API. No bundler,
      // no framework — files in this directory are served verbatim by Vite's
      // public/ convention and copied into dist/ at build.
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const currentWindow = window.__TAURI__.window.getCurrentWindow();

      const meshSel  = document.getElementById('mesh');
      const codeInp  = document.getElementById('code');
      const requestBtn = document.getElementById('request');
      const pairBtn  = document.getElementById('pair');
      const cancelBtn  = document.getElementById('cancel');
      const cancelBtn2 = document.getElementById('cancel2');
      const status     = document.getElementById('status');
      const scanStatus = document.getElementById('scan-status');
      const stage1     = document.getElementById('stage1');
      const stage2     = document.getElementById('stage2');
      const codePrompt = document.getElementById('code-prompt');

      const meshes = new Map();

      // Enable Request pairing once a mesh is selected.
      meshSel.addEventListener('change', () => {
        requestBtn.disabled = !meshSel.value;
      });

      // Enable Pair once a 6-digit code is entered in stage 2.
      codeInp.addEventListener('input', () => {
        pairBtn.disabled = !(/^\d{6}$/.test(codeInp.value));
      });

      // Discovery events — same wiring as before.
      (async () => {
        await listen('pair://mesh-discovered', (event) => {
          const mesh = event.payload;
          if (meshes.has(mesh.vault_id)) return;
          meshes.set(mesh.vault_id, mesh);
          const opt = document.createElement('option');
          opt.value = mesh.vault_id;
          opt.textContent = `${mesh.mesh_name} (${mesh.online_count} online)`;
          meshSel.appendChild(opt);
          scanStatus.textContent = `Scanning… found ${meshes.size} so far`;
        });

        await listen('pair://discovery-finished', () => {
          if (meshes.size === 0) {
            scanStatus.textContent = 'No meshes found.';
          } else {
            scanStatus.textContent = `Found ${meshes.size} mesh(es).`;
          }
        });

        try {
          await invoke('start_pair_discovery');
        } catch (e) {
          scanStatus.className = 'row error';
          scanStatus.textContent = 'Discovery failed: ' + e;
        }
      })();

      // Step 1: connect + park (triggers responder to show the code).
      requestBtn.addEventListener('click', async () => {
        requestBtn.disabled = true;
        meshSel.disabled = true;
        status.className = 'row';
        status.textContent = '';
        scanStatus.textContent = `Waiting for code on ${meshes.get(meshSel.value)?.mesh_name ?? 'the other device'}…`;

        try {
          const result = await invoke('request_pairing', { vaultId: meshSel.value });
          // Connection established — responder is now showing the code.
          codePrompt.textContent = `Enter the code shown on ${result.device_name}:`;
          stage2.style.display = 'block';
          codeInp.focus();
        } catch (e) {
          status.className = 'row error';
          status.textContent = 'Connection failed: ' + e;
          // Re-enable stage 1 so the user can retry.
          requestBtn.disabled = false;
          meshSel.disabled = false;
          scanStatus.textContent = meshes.size > 0
            ? `Found ${meshes.size} mesh(es).`
            : 'No meshes found.';
        }
      });

      // Step 2: submit the typed code to complete the HMAC exchange.
      pairBtn.addEventListener('click', async () => {
        pairBtn.disabled = true;
        status.className = 'row';
        status.textContent = 'Pairing…';
        try {
          const result = await invoke('submit_pair_code', {
            vaultId: meshSel.value,
            code: codeInp.value,
          });
          status.className = 'row ok';
          status.textContent = `Paired with ${result.device_name}. Closing…`;
          setTimeout(() => currentWindow.close(), 1500);
        } catch (e) {
          status.className = 'row error';
          status.textContent = 'Pairing failed: ' + e;
          pairBtn.disabled = false;
        }
      });

      // Cancel from stage 1.
      cancelBtn.addEventListener('click', async () => {
        try {
          await invoke('cancel_pair_discovery');
        } catch (_) {
          // ignore — cancellation is idempotent
        }
        currentWindow.close();
      });

      // Cancel from stage 2 (same effect).
      cancelBtn2.addEventListener('click', async () => {
        try {
          await invoke('cancel_pair_discovery');
        } catch (_) {
          // ignore — cancellation is idempotent
        }
        currentWindow.close();
      });
    </script>
  </body>
</html>
