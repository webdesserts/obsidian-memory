[package]
name = "p2p-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
async-trait.workspace = true
serde.workspace = true
# `mesh_from_discovery_event` (discovery) + `publish_mesh_info` (node) serialize
# `MeshMetadata` to/from JSON in production code, so `serde_json` is a hard dep.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
# `AllowedPeer`/`PairingSession` timestamps use `web_time` for a portable
# SystemTime/Instant.
web-time.workspace = true
# Pairing HMAC-SHA256 (the only consumer of these in the crate).
sha2 = "0.10"
hmac = "0.12"
# iroh networking. `iroh` supplies `RelayUrl` (used by the relay layer and its
# off-LAN classifier); `iroh-relay` with the `server` feature supplies the
# embedded relay server. Versions mirror sync-daemon's declarations.
iroh = { version = "1.0.0-rc.1", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "1.0.0-rc.1", features = ["server"] }
# The workspace `tokio` is `features = ["full"]`, which already includes `fs`
# (used by `FileKeyStorage`), `rt`, and `macros`. No per-crate feature subset needed.
tokio.workspace = true

[dev-dependencies]
# The pairing wire-format round-trip tests assert bincode byte-stability.
bincode.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile.workspace = true
