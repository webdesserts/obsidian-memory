[package]
name = "p2p-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
# `AllowedPeer` timestamps use `web_time` for a portable SystemTime/Instant.
web-time.workspace = true
# The workspace `tokio` is `features = ["full"]`, which already includes `fs`
# (used by `FileKeyStorage`), `rt`, and `macros`. No per-crate feature subset needed.
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile.workspace = true
