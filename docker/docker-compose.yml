services:
  # OAuth 2.1 + API key authentication
  auth-service:
    image: ghcr.io/webdesserts/auth-service:${VERSION:-latest}
    volumes:
      - auth-config:/config
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - AUTH_CONFIG_PATH=/config
      - AUTH_PUBLIC_URL=https://${DOMAIN:?DOMAIN required}/auth
      - AUTH_PATH_PREFIX=/auth
    expose:
      - "3001"
    networks:
      - proxy
    restart: unless-stopped
    mem_limit: 48m
    memswap_limit: 48m
    mem_reservation: 16m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # MCP server (HTTP transport)
  memory:
    image: ghcr.io/webdesserts/memory:${VERSION:-latest}
    volumes:
      - notes:/notes:rw
    environment:
      - RUST_LOG=${RUST_LOG:-info}
    expose:
      - "3000"
    networks:
      - proxy
    depends_on:
      - auth-service
    restart: unless-stopped
    mem_limit: 1280m
    memswap_limit: 1280m
    mem_reservation: 128m
    oom_score_adj: 300
    command: ["mcp", "--vault", "/notes", "up", "--port", "3000", "--bind", "0.0.0.0"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # P2P vault sync daemon
  sync:
    image: ghcr.io/webdesserts/memory:${VERSION:-latest}
    volumes:
      - notes:/notes:rw
    environment:
      - RUST_LOG=${RUST_LOG:-info}
    expose:
      - "8080"
    networks:
      - proxy
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 64m
    command: ["sync", "up", "--vault", "/notes", "--listen", "0.0.0.0:8080"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Vault data - bind mount to host directory
  notes:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NOTES_PATH:?NOTES_PATH must be set to vault directory}

  # Persistent config for auth service (tokens, clients, API keys)
  auth-config:

networks:
  proxy:
    external: true
