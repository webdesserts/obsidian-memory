[workspace]
resolver = "2"
members = [
    "crates/memory",
    "crates/memory-common",
    "crates/wiki-links",
    "crates/obsidian-fs",
    "crates/notes-core",
    "crates/semantic-embeddings",
    "crates/auth-service",
    "crates/p2p-core",
    "crates/sync-core",
    "crates/sync-daemon",
    "crates/desktop",
    "crates/vault-sync",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
authors = ["Michael Mullins"]
license = "Apache-2.0"
repository = "https://github.com/webdesserts/obsidian-memory"

[workspace.dependencies]
# Utilities
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

# CRDT (for sync crates)
loro = "1.13"

# Portable content hashing (deterministic across machines — pure-Rust, no SIMD/iroh deps)
blake3 = "1"

# Serialization (for sync crates)
serde_yaml = "0.9"
bincode = "1.3"
toml = "0.8"

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP server
axum = "0.8"

# File watching
notify = "8"
notify-debouncer-mini = "0.6"

# Cross-platform time (works in WASM)
web-time = "1"

# UUID generation (v4 random, js for WASM compatibility)
uuid = { version = "1", features = ["v4", "js"] }

# Random number generation (for peer ID generation)
rand = "0.9"
getrandom = { version = "0.2", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# Ed25519 keypairs for peer identity (pure Rust, WASM-compatible)
ed25519-dalek = { version = "2", features = ["rand_core"] }

# WASM (for sync-wasm)
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# Testing
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
